services:
  - type: web
    name: tg-file-downloader
    env: node
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: TELEGRAM_API_ID
        sync: false
      - key: TELEGRAM_API_HASH
        sync: false
      - key: TELEGRAM_SESSION_STRING
        sync: false
      - key: PORT
        value: "10000"
    healthCheckPath: /health
